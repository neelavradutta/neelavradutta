<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="190" height="50" viewBox="0 0 190 50" role="img" aria-label="Twitter">
  <defs>
    <linearGradient id="holo-tw-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="18%" stop-color="#f6f8fc"/>
      <stop offset="38%" stop-color="#0069e0"/>
      <stop offset="58%" stop-color="#475569"/>
      <stop offset="78%" stop-color="#f6f8fc"/>
      <stop offset="100%" stop-color="#0f172a"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      circle { animation: nx-halo 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      text { animation: nx-rise 700ms cubic-bezier(0.16,1,0.3,1) both; }
      text:nth-of-type(2) { animation-delay: 90ms; }
      text:nth-of-type(3) { animation-delay: 170ms; }
      @keyframes nx-halo { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.14); opacity: 0.7; } }
      @keyframes nx-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
  <rect x="1" y="2" width="188" height="46" rx="23" fill="#ffffff" stroke="url(#holo-tw-l)" stroke-width="2"/>
  <rect x="2" y="3" width="186" height="44" rx="22" fill="none" stroke="#0f172a" stroke-opacity="0.08"/>
  <circle cx="28" cy="25" r="12" fill="#0f172a" fill-opacity="0.1"/>
  <text x="28" y="30" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="900" fill="#0f172a" text-anchor="middle">X</text>
  <text x="49" y="21" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="850" letter-spacing="1.2" fill="#475569">Twitter</text>
  <text x="49" y="37" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="800" fill="#0f172a">@Neel_avra</text>
</svg>
