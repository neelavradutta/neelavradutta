      #gs-stats-neelavradutta-github-dark-dark .nx-handle { animation: nx-handle 900ms cubic-bezier(0.16,1,0.3,1) 250ms both; }
      #gs-stats-neelavradutta-github-dark-dark .nx-shine { stroke-dasharray: 260; animation: nx-draw 1s cubic-bezier(0.16,1,0.3,1) 550ms both; }
      #gs-stats-neelavradutta-github-dark-dark .nx-num { animation: nx-pop 700ms cubic-bezier(0.34,1.56,0.64,1) both; transform-box: fill-box; transform-origin: center bottom; }
      #gs-stats-neelavradutta-github-dark-dark .nx-dot { animation: nx-pop 550ms cubic-bezier(0.34,1.56,0.64,1) both; transform-box: fill-box; transform-origin: center; }
      #gs-stats-neelavradutta-github-dark-dark .aura-ring.nx-spin { animation: gs-stats-neelavradutta-github-dark-dark-ring 8s ease-in-out infinite, nx-spin 60s linear infinite; transform-box: fill-box; transform-origin: center; }
      #gs-stats-neelavradutta-github-dark-dark .aura-ring-b.nx-spin-rev { animation: gs-stats-neelavradutta-github-dark-dark-ring 10s ease-in-out infinite 1.6s, nx-spin-rev 45s linear infinite; transform-box: fill-box; transform-origin: center; }
      #gs-stats-neelavradutta-github-dark-dark g.aura-chip { animation: nx-card 800ms cubic-bezier(0.22,1,0.36,1) both; transition: filter 240ms ease; cursor: pointer; }
