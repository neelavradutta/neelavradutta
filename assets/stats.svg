      #gs-stats-neelavradutta-github-dark-dark .aura-bar { animation: nx-bar 1s cubic-bezier(0.16,1,0.3,1) both; transition: filter 220ms ease; }
      #gs-stats-neelavradutta-github-dark-dark g.aura-chip:hover .aura-bar { filter: brightness(1.2); }
