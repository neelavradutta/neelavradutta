<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-label="About NEELAVRA DUTTA">
  <defs>
    <linearGradient id="about-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fc"/>
      <stop offset="54%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fc"/>
    </linearGradient>
    <radialGradient id="about-orb-0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0069e0" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#0069e0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0069e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="about-orb-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#29b841" stop-opacity="0.2"/>
      <stop offset="58%" stop-color="#29b841" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#29b841" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="about-orb-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#570cd4" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#570cd4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#570cd4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="about-orb-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b7d0" stop-opacity="0.2"/>
      <stop offset="58%" stop-color="#10b7d0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b7d0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="about-typewriter-l">
      <rect x="46" y="178" width="0" height="20">
        <animate attributeName="width" values="0;16;32;48;64;80;96;112;128;144;160;175" keyTimes="0;0.09;0.18;0.27;0.36;0.45;0.54;0.63;0.72;0.81;0.9;1" calcMode="discrete" begin="1.1s" dur="1s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="about-round-l"><rect width="860" height="240" rx="32" ry="32"/></clipPath>
  </defs>
  <style>
    .orb-a { animation: float-a 9s ease-in-out infinite; }
    .orb-b { animation: float-b 11s ease-in-out infinite 1.1s; }
    .orb-c { animation: float-c 13s ease-in-out infinite 0.6s; }
    .ring { animation: ring 8s ease-in-out infinite; }
    .ring-b { animation: ring 10s ease-in-out infinite 1.6s; }
    .cursor { animation: cursor 1.1s step-end infinite; }
    .label { animation: label 900ms cubic-bezier(0.16,1,0.3,1) both; }
    .line { animation: rise 900ms cubic-bezier(0.16,1,0.3,1) both; }
    .line-2 { animation-delay: 140ms; }
    .line-3 { animation-delay: 280ms; }
    @keyframes float-a { 0%,100% { transform: translate(0,0); opacity: .58; } 50% { transform: translate(28px,-20px); opacity: .86; } }
    @keyframes float-b { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(-24px,18px); opacity: .72; } }
    @keyframes float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes ring { 0%,100% { opacity: .06; } 50% { opacity: .22; } }
    @keyframes cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes label { from { opacity: 0; letter-spacing: 4px; } to { opacity: 1; letter-spacing: -0.4px; } }
  </style>
  <g clip-path="url(#about-round-l)">
    <rect width="860" height="240" rx="32" fill="url(#about-bg)"/>
    <ellipse class="orb-a" cx="138" cy="42" rx="206" ry="102" fill="url(#about-orb-0)"/>
    <ellipse class="orb-b" cx="654" cy="52" rx="241" ry="94" fill="url(#about-orb-1)"/>
    <ellipse class="orb-c" cx="499" cy="212" rx="310" ry="76" fill="url(#about-orb-2)"/>
    <ellipse class="orb-b" cx="826" cy="188" rx="172" ry="92" fill="url(#about-orb-3)"/>
    <circle class="ring" cx="752" cy="120" r="25.2" fill="none" stroke="#0f172a" stroke-opacity="0.36"/>
    <circle class="ring-b" cx="752" cy="120" r="43.4" fill="none" stroke="#0f172a" stroke-opacity="0.22"/>
    <circle class="ring" cx="752" cy="120" r="70" fill="none" stroke="#0f172a" stroke-opacity="0.14"/>
    <rect x="28" y="26" width="804" height="188" rx="28" fill="#ffffff" stroke="#d7dee8" stroke-opacity="0.48"/>
    <text class="label" x="46" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="24" font-weight="850" letter-spacing="-0.4" fill="#475569">About</text>
    <text class="line" x="46" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3" fill="#0f172a">Full-Stack Developer skilled in Python, FastAPI,</text>
    <text class="line line-2" x="46" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3" fill="#0f172a">Next.js, React, MySQL, and Computer Vision. Passionate</text>
    <text class="line line-3" x="46" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3" fill="#0f172a">about AI-powered applications and scalable software.</text>
    <g clip-path="url(#about-typewriter-l)">
      <text x="48" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750" fill="#0069e0">&gt; open to collaboration</text>
      <text class="cursor" x="211" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="850" fill="#0069e0">_</text>
    </g>
    <rect x="0.5" y="0.5" width="859" height="239" rx="31.5" fill="none" stroke="#d7dee8" stroke-opacity="0.62"/>
  </g>
</svg>
