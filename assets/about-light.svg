<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-label="About NEELAVRA DUTTA">
  <defs>
    <linearGradient id="about-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="54%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="about-orb-0" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.28"/>
      <stop offset="58%" stop-color="#0969da" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="about-orb-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2da44e" stop-opacity="0.2"/>
      <stop offset="58%" stop-color="#2da44e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#2da44e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="about-orb-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8250df" stop-opacity="0.26"/>
      <stop offset="58%" stop-color="#8250df" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="about-orb-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.2"/>
      <stop offset="58%" stop-color="#0891b2" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .orb-a { animation: float-a 9s ease-in-out infinite; }
    .orb-b { animation: float-b 11s ease-in-out infinite 1.1s; }
    .orb-c { animation: float-c 13s ease-in-out infinite 0.6s; }
    .ring { animation: ring 8s ease-in-out infinite; }
    .ring-b { animation: ring 10s ease-in-out infinite 1.6s; }
    .cursor { animation: cursor 1.1s step-end infinite; }
    .line { animation: rise 700ms ease-out both; }
    .line-2 { animation-delay: 120ms; }
    .line-3 { animation-delay: 240ms; }
    .line-4 { animation-delay: 360ms; }
    @keyframes float-a { 0%,100% { transform: translate(0,0); opacity: .58; } 50% { transform: translate(28px,-20px); opacity: .86; } }
    @keyframes float-b { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(-24px,18px); opacity: .72; } }
    @keyframes float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes ring { 0%,100% { opacity: .06; } 50% { opacity: .22; } }
    @keyframes cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <g>
    <rect width="860" height="240" rx="20" fill="url(#about-bg)"/>
    <ellipse class="orb-a" cx="138" cy="42" rx="206" ry="102" fill="url(#about-orb-0)"/>
    <ellipse class="orb-b" cx="654" cy="52" rx="241" ry="94" fill="url(#about-orb-1)"/>
    <ellipse class="orb-c" cx="499" cy="212" rx="310" ry="76" fill="url(#about-orb-2)"/>
    <ellipse class="orb-b" cx="826" cy="188" rx="172" ry="92" fill="url(#about-orb-3)"/>
    <circle class="ring" cx="752" cy="120" r="25.2" fill="none" stroke="#1f2328" stroke-opacity="0.36"/>
    <circle class="ring-b" cx="752" cy="120" r="43.4" fill="none" stroke="#1f2328" stroke-opacity="0.22"/>
    <circle class="ring" cx="752" cy="120" r="70" fill="none" stroke="#1f2328" stroke-opacity="0.14"/>
    <g transform="rotate(-32 752 120)">
      <circle cx="795.4" cy="120" r="4" fill="#0969da">
        <animateTransform attributeName="transform" type="scale" values="0.85;1.2;0.85" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect x="26" y="24" width="808" height="192" rx="20" fill="rgba(255,255,255,0.62)" stroke="#0969da" stroke-opacity="0.4"/>
    <text x="48" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-weight="800" letter-spacing="4" fill="#57606a">ABOUT</text>
    <text class="line" x="46" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3" fill="#1f2328">Full-Stack Developer specializing in Python, FastAPI, Next.js,</text>
    <text class="line line-2" x="46" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3" fill="#1f2328">React, MySQL, and Computer Vision. Passionate about AI-driven</text>
    <text class="line line-3" x="46" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="20" font-weight="800" letter-spacing="-0.3" fill="#1f2328">applications, scalable software, and clean architecture.</text>
    <text class="line line-4" x="48" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="750" fill="#0969da">&gt; open to collaboration</text>
    <text class="cursor" x="211" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13" font-weight="850" fill="#0969da">_</text>
    <rect x="0.5" y="0.5" width="859" height="239" rx="19.5" fill="none" stroke="#0969da" stroke-opacity="0.5"/>
  </g>
</svg>
