  <style>
    #gs-stats-neelavradutta-github-dark-light .aura-orb-a { animation: gs-stats-neelavradutta-github-dark-light-float-a 9s ease-in-out infinite; }
    #gs-stats-neelavradutta-github-dark-light .aura-orb-b { animation: gs-stats-neelavradutta-github-dark-light-float-b 11s ease-in-out infinite 1.1s; }
    #gs-stats-neelavradutta-github-dark-light .aura-orb-c { animation: gs-stats-neelavradutta-github-dark-light-float-c 13s ease-in-out infinite 0.6s; }
    #gs-stats-neelavradutta-github-dark-light .aura-ring { animation: gs-stats-neelavradutta-github-dark-light-ring 8s ease-in-out infinite; }
    #gs-stats-neelavradutta-github-dark-light .aura-ring-b { animation: gs-stats-neelavradutta-github-dark-light-ring 10s ease-in-out infinite 1.6s; }
    #gs-stats-neelavradutta-github-dark-light .aura-chip { animation: gs-stats-neelavradutta-github-dark-light-chip 650ms ease-out both; }
    #gs-stats-neelavradutta-github-dark-light .aura-cursor { animation: gs-stats-neelavradutta-github-dark-light-cursor 1.1s step-end infinite; }
    #gs-stats-neelavradutta-github-dark-light .aura-bar { animation: gs-stats-neelavradutta-github-dark-light-bar 1.15s ease-out both; transform-box: fill-box; transform-origin: left; }
    #gs-stats-neelavradutta-github-dark-light .aura-cell { animation: gs-stats-neelavradutta-github-dark-light-cell 520ms ease-out both; }
    @keyframes gs-stats-neelavradutta-github-dark-light-cell { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes gs-stats-neelavradutta-github-dark-light-float-a { 0%,100% { transform: translate(0,0); opacity: .58; } 50% { transform: translate(28px,-20px); opacity: .86; } }
    @keyframes gs-stats-neelavradutta-github-dark-light-float-b { 0%,100% { transform: translate(0,0); opacity: .42; } 50% { transform: translate(-24px,18px); opacity: .72; } }
    @keyframes gs-stats-neelavradutta-github-dark-light-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes gs-stats-neelavradutta-github-dark-light-ring { 0%,100% { opacity: .06; } 50% { opacity: .22; } }
    @keyframes gs-stats-neelavradutta-github-dark-light-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes gs-stats-neelavradutta-github-dark-light-cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes gs-stats-neelavradutta-github-dark-light-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      #gs-stats-neelavradutta-github-dark-light g.aura-chip > rect:first-of-type { animation: nx-glow 4.2s ease-in-out 1.4s infinite; }
      #gs-stats-neelavradutta-github-dark-light .aura-bar { animation: nx-bar 1s cubic-bezier(0.16,1,0.3,1) both, nx-burn 2.4s ease-in-out 1.2s infinite; }
      #gs-stats-neelavradutta-github-dark-light .nx-flm { animation: nx-flicker 280ms ease-in-out infinite; transform-box: fill-box; transform-origin: center top; }
      @keyframes nx-glow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.38); } }
      @keyframes nx-burn { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.28); } }
      @keyframes nx-flicker { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.28); } }

    @media (prefers-reduced-motion: no-preference) {
      #gs-stats-neelavradutta-github-dark-light .nx-in { animation: nx-in 700ms cubic-bezier(0.16,1,0.3,1) both; }
      #gs-stats-neelavradutta-github-dark-light .nx-in-2 { animation-delay: 120ms; }
      #gs-stats-neelavradutta-github-dark-light .nx-fade { animation: nx-fade 500ms ease-out both; }
      #gs-stats-neelavradutta-github-dark-light .nx-avatar { animation: nx-scale-in 650ms cubic-bezier(0.16,1,0.3,1) 60ms both; transform-box: fill-box; transform-origin: center; }
      #gs-stats-neelavradutta-github-dark-light .nx-ring-draw { stroke-dasharray: 302; animation: nx-scale-in 650ms cubic-bezier(0.16,1,0.3,1) 60ms both, nx-draw 950ms cubic-bezier(0.16,1,0.3,1) 200ms both; transform-box: fill-box; transform-origin: center; }
      #gs-stats-neelavradutta-github-dark-light .nx-handle { animation: nx-handle 900ms cubic-bezier(0.16,1,0.3,1) 250ms both; }
      #gs-stats-neelavradutta-github-dark-light .nx-location { animation: nx-fade 500ms ease-out 900ms both; }
      #gs-stats-neelavradutta-github-dark-light .nx-shine { stroke-dasharray: 260; animation: nx-draw 1s cubic-bezier(0.16,1,0.3,1) 550ms both; }
      #gs-stats-neelavradutta-github-dark-light .nx-num { animation: nx-pop 700ms cubic-bezier(0.34,1.56,0.64,1) both; transform-box: fill-box; transform-origin: center bottom; }
      #gs-stats-neelavradutta-github-dark-light .nx-dot { animation: nx-pop 550ms cubic-bezier(0.34,1.56,0.64,1) both; transform-box: fill-box; transform-origin: center; }
      #gs-stats-neelavradutta-github-dark-light .aura-ring.nx-spin { animation: gs-stats-neelavradutta-github-dark-light-ring 8s ease-in-out infinite, nx-spin 60s linear infinite; transform-box: fill-box; transform-origin: center; }
      #gs-stats-neelavradutta-github-dark-light .aura-ring-b.nx-spin-rev { animation: gs-stats-neelavradutta-github-dark-light-ring 10s ease-in-out infinite 1.6s, nx-spin-rev 45s linear infinite; transform-box: fill-box; transform-origin: center; }
      #gs-stats-neelavradutta-github-dark-light g.aura-chip { animation: nx-card 800ms cubic-bezier(0.22,1,0.36,1) both; transition: filter 240ms ease; cursor: pointer; }
      #gs-stats-neelavradutta-github-dark-light g.aura-chip:hover { filter: brightness(1.1) drop-shadow(0 10px 16px rgba(88,166,255,0.28)); }
      #gs-stats-neelavradutta-github-dark-light g.aura-chip > rect:first-of-type { animation: nx-glow 4.2s ease-in-out 1.4s infinite; }
      #gs-stats-neelavradutta-github-dark-light .aura-bar { animation: nx-bar 1s cubic-bezier(0.16,1,0.3,1) both, nx-burn 2.4s ease-in-out 1.2s infinite; transition: filter 220ms ease; }
      #gs-stats-neelavradutta-github-dark-light g.aura-chip:hover .aura-bar { filter: brightness(1.2); }
      #gs-stats-neelavradutta-github-dark-light .nx-flm { animation: nx-flicker 280ms ease-in-out infinite; transform-box: fill-box; transform-origin: center top; }
      #gs-stats-neelavradutta-github-dark-light .nx-hero-flame { animation: nx-hero-flame 180ms ease-in-out infinite; transform-box: fill-box; transform-origin: right center; }
      #gs-stats-neelavradutta-github-dark-light .nx-live-1 { animation: nx-glow 3.6s ease-in-out 3.2s infinite; }
      #gs-stats-neelavradutta-github-dark-light .nx-live-2 { animation: nx-glow 3s ease-in-out 3.1s infinite; }
      #gs-stats-neelavradutta-github-dark-light .nx-live-3 { animation: nx-glow 2.4s ease-in-out 3s infinite; }
      #gs-stats-neelavradutta-github-dark-light .nx-live-4 { animation: nx-glow 1.9s ease-in-out 2.9s infinite; }
      @keyframes nx-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes nx-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes nx-scale-in { from { opacity: 0; transform: scale(0.88); } to { opacity: 1; transform: scale(1); } }
      @keyframes nx-draw { to { stroke-dashoffset: 0; } }
      @keyframes nx-handle { from { opacity: 0; letter-spacing: 8px; } to { opacity: 1; letter-spacing: 2.6px; } }
      @keyframes nx-pop { 0% { opacity: 0; transform: scale(0.5); } 65% { opacity: 1; transform: scale(1.12); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes nx-spin { to { transform: rotate(360deg); } }
      @keyframes nx-spin-rev { to { transform: rotate(-360deg); } }
      @keyframes nx-card { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes nx-bar { 0% { transform: scaleX(0); } 75% { transform: scaleX(1.03); } 100% { transform: scaleX(1); } }
      @keyframes nx-flicker { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.28); } }
      @keyframes nx-hero-flame { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(1.22); } }
      @keyframes nx-glow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.38); } }
      @keyframes nx-burn { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.28); } }
    }
  </style>
