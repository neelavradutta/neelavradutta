      #gs-stats-neelavradutta-github-dark-light .nx-orbit { animation: nx-orbit 32s linear infinite; transform-box: view-box; transform-origin: 735px 88px; }
      #gs-stats-neelavradutta-github-dark-light .nx-sweep { animation: nx-sweep 4.2s cubic-bezier(0.45,0,0.55,1) infinite 900ms; }
      #gs-stats-neelavradutta-github-dark-light .aura-chip.nx-float { animation: gs-stats-neelavradutta-github-dark-light-chip 650ms ease-out both, nx-float 7s ease-in-out infinite 1s; }
      #gs-stats-neelavradutta-github-dark-light .aura-bar.nx-glow { animation: gs-stats-neelavradutta-github-dark-light-bar 1.15s ease-out both, nx-glow 3.4s ease-in-out infinite 1.3s; }
      @keyframes nx-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes nx-pop { 0% { opacity: 0; transform: scale(0.6); } 60% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
      @keyframes nx-halo { 0%,100% { transform: scale(1); opacity: 0.92; } 50% { transform: scale(1.045); opacity: 0.62; } }
      @keyframes nx-orbit { to { transform: rotate(360deg); } }
      @keyframes nx-sweep { 0% { stroke-dashoffset: 340; } 55%,100% { stroke-dashoffset: -260; } }
      @keyframes nx-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3.5px); } }
      @keyframes nx-glow { 0%,100% { opacity: 0.95; } 50% { opacity: 0.62; } }
